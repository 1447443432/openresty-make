# 第三方模块
ENABLE_SUBSTITUTIONS_FILTER=${ENABLE_SUBSTITUTIONS_FILTER:-true}
SUB_FILTER_VERSION=${SUB_FILTER_VERSION:-0.6.4}

ENABLE_UPSTREAM_CHECK=${ENABLE_UPSTREAM_CHECK:-true}
UPSTREAM_CHECK_REF=${UPSTREAM_CHECK_REF:-87bfa66ddf16c17053ba7bbae72400c9939ecf6d}

# auto：自动尝试模块源码中的 check_*.patch
# 也可以指定文件名，例如 check_1.20.1+.patch
UPSTREAM_CHECK_PATCH=${UPSTREAM_CHECK_PATCH:-auto}

# 依赖版本默认从 openresty/docker-openresty 官方 Dockerfile 自动解析
# 需要完全可重复构建时，可以把 auto 改为固定版本
OPENSSL_VERSION=${OPENSSL_VERSION:-auto}
OPENSSL_PATCH_VERSION=${OPENSSL_PATCH_VERSION:-auto}
PCRE2_VERSION=${PCRE2_VERSION:-auto}
PCRE2_SHA256=${PCRE2_SHA256:-auto}

OPENRESTY_DOCKER_REF=${OPENRESTY_DOCKER_REF:-master}
OPENRESTY_PATCH_REF=${OPENRESTY_PATCH_REF:-master}

# 官网或 GitHub 暂时不可用时使用的回退值
OPENSSL_FALLBACK_VERSION=${OPENSSL_FALLBACK_VERSION:-3.5.7}
OPENSSL_PATCH_FALLBACK_VERSION=${OPENSSL_PATCH_FALLBACK_VERSION:-3.5.5}
PCRE2_FALLBACK_VERSION=${PCRE2_FALLBACK_VERSION:-10.47}
PCRE2_FALLBACK_SHA256=${PCRE2_FALLBACK_SHA256:-c08ae2388ef333e8403e670ad70c0a11f1eed021fd88308d7e02f596fcd9dc16}

ALLOW_DEPENDENCY_FALLBACK=${ALLOW_DEPENDENCY_FALLBACK:-true}

# OpenResty 专用 CentOS 7 Builder
# 可以使用 BUILDER_IMAGE 临时覆盖
BUILDER_IMAGE_AMD64=${BUILDER_IMAGE_AMD64:-registry.cn-shanghai.aliyuncs.com/jing-images/linux_amd64_centos_builder:7.9-openresty-1.0.0}
BUILDER_IMAGE_ARM64=${BUILDER_IMAGE_ARM64:-registry.cn-shanghai.aliyuncs.com/jing-images/linux_arm64_centos_builder:7.9-openresty-1.0.0}